name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    # Pinned: `ubuntu-latest` moves to a new release on 19 Oct 2026.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: No tracked file starts with a byte-order mark
        run: node ../../scripts/check-no-bom.mjs
      - name: Layer boundaries hold (core, modules, packs)
        run: node ../../scripts/check-boundaries.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: The permission tables in the docs match the code
        run: |
          npm run gen:permissions
          git diff --exit-code ../../docs/permission-matrix.md
      - name: The committed OpenAPI contract is current
        run: |
          npm run gen:openapi
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - run: npm ci
      # The web tests check our built-in theme against the API's own readability rules, and typechecking
      # sees those imports, so the API's packages must be installed too.
      - run: npm ci
        working-directory: apps/api
      - name: The generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Every public page is inside its page-weight budget
        run: node ../../scripts/check-page-weight.mjs --out out --budget page-weight-budget.json

  bundle:
    # Proves the whole thing packages as one Worker: static app plus API. No account needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/api
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
        working-directory: apps/api
        env:
          WRANGLER_SEND_METRICS: "false"
