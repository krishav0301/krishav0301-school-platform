name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    # Pinned: `ubuntu-latest` moves to a new release on 19 Oct 2026.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: school_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://school_owner:ci-only-password@localhost:5432/school_dev
      ALLOWED_HOSTS: localhost
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest
      - name: The committed OpenAPI contract is current
        run: |
          uv run python manage.py spectacular --file openapi.yml --validate
          git diff --exit-code openapi.yml

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: The generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
